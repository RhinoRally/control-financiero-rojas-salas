<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Financiero Rojas Salas</title>
    <style>
        :root {
            --bg-color: #000000; --card-bg: #1C1C1E; --text-main: #FFFFFF; --text-muted: #8E8E93;
            --accent: #E91E63; --ingreso: #34C759; --nav-bg: #121212; --border: #2C2C2E;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 80px; }
        
        header { background-color: var(--card-bg); padding: 15px; text-align: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;}
        h1 { font-size: 1.2rem; font-weight: 600; }
        
        .screen { display: none; padding: 15px; }
        .screen.active { display: block; }
        
        .card { background-color: var(--card-bg); border-radius: 10px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border); }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .card-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px; }
        
        .monto { font-weight: bold; font-size: 1.1rem; }
        .monto.gasto { color: var(--accent); }
        .monto.ingreso { color: var(--ingreso); }
        .monto.neutro { color: #0A84FF; }
        
        .btn-add { background-color: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 1rem; cursor: pointer; float: right; margin-bottom: 15px;}
        .btn-add.ingreso-btn { background-color: var(--ingreso); }
        .btn-add.patri-btn { background-color: #0A84FF; }
        .btn-full { width: 100%; background-color: #0A84FF; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 15px;}
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        input, select { width: 100%; background-color: #2C2C2E; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; }
        
        .btn-submit { width: 100%; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px;}
        .bg-gasto { background-color: var(--accent); }
        .bg-ingreso { background-color: var(--ingreso); }
        .bg-patri { background-color: #0A84FF; }
        
        nav { position: fixed; bottom: 0; width: 100%; background-color: var(--nav-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 20px 0; z-index: 100;}
        .nav-item { color: var(--text-muted); text-align: center; font-size: 0.75rem; cursor: pointer; flex: 1;}
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-icon { font-size: 1.4rem; display: block; margin-bottom: 3px; }
        
        .bccr-panel { background-color: #1A1A24; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #0A84FF; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; padding: 20px; overflow-y: auto;}
        .modal-content { background: var(--bg-color); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-top: 10px;}
        .close-modal { color: var(--text-muted); float: right; font-size: 28px; font-weight: bold; cursor: pointer; margin-top: -10px;}
        
        .cat-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border);}
        .cat-del { color: var(--accent); cursor: pointer; font-weight: bold;}

        .progress-bar { width: 100%; background-color: #2C2C2E; border-radius: 5px; height: 10px; margin-top: 10px; overflow: hidden;}
        .progress-fill { height: 100%; background-color: #34C759; width: 0%; transition: width 0.3s;}
    </style>
</head>
<body>

    <header>
        <h1>App Financiera CCSS</h1>
    </header>

    <!-- GASTOS -->
    <div id="pantalla-gastos" class="screen active">
        <button class="btn-add" onclick="abrirModal('modal-gasto')">+ Gasto</button>
        <div style="clear: both; margin-bottom: 10px;"></div>
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Gastos Ordinarios</h2>
        <div id="lista-gastos"></div>
    </div>

    <!-- INGRESOS -->
    <div id="pantalla-ingresos" class="screen">
        <button class="btn-add ingreso-btn" onclick="abrirModal('modal-ingreso')">+ Ingreso</button>
        <div style="clear: both; margin-bottom: 10px;"></div>
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Registro de Ingresos</h2>
        <div id="lista-ingresos"></div>
    </div>

    <!-- PROVISIONES -->
    <div id="pantalla-provisiones" class="screen">
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Provisiones PediAhorro</h2>
        
        <div class="bccr-panel">
            <label>Tipo de Cambio Venta (Automático/Manual):</label>
            <input type="number" id="input-bccr" placeholder="Consultando BCCR..." onchange="guardarBCCR()">
        </div>

        <button class="btn-full" onclick="registrarAportePediahorro()">➕ Registrar Aporte Mensual (₡100,000)</button>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; text-align: center;">Meses aportados: <span id="contador-aportes" style="color:white; font-weight:bold;">0</span></p>

        <div id="lista-provisiones"></div>
    </div>

    <!-- PATRIMONIO / INVERSIONES -->
    <div id="pantalla-patrimonio" class="screen">
        <button class="btn-add patri-btn" onclick="abrirModal('modal-patri')">+ Activo</button>
        <div style="clear: both; margin-bottom: 10px;"></div>
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Patrimonio e Inversiones</h2>
        <div id="lista-patrimonio"></div>
    </div>

    <!-- CATEGORÍAS Y AJUSTES -->
    <div id="pantalla-ajustes" class="screen">
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Gestión de Categorías (Gastos)</h2>
        <div class="input-group" style="display:flex; gap:10px;">
            <input type="text" id="nueva-cat" placeholder="Nueva categoría...">
            <button onclick="agregarCategoria()" style="background:var(--ingreso); color:white; border:none; border-radius:8px; padding:0 15px; font-weight:bold;">Añadir</button>
        </div>
        <div class="card" id="lista-categorias-ui"></div>
    </div>

    <!-- NAVEGACIÓN -->
    <nav>
        <div class="nav-item active" onclick="cambiarPantalla('gastos', this)">
            <span class="nav-icon">📉</span>Gastos
        </div>
        <div class="nav-item" onclick="cambiarPantalla('ingresos', this)">
            <span class="nav-icon">📈</span>Ingresos
        </div>
        <div class="nav-item" onclick="cambiarPantalla('provisiones', this)">
            <span class="nav-icon">🏦</span>Ahorro
        </div>
        <div class="nav-item" onclick="cambiarPantalla('patrimonio', this)">
            <span class="nav-icon">💰</span>Patrimonio
        </div>
        <div class="nav-item" onclick="cambiarPantalla('ajustes', this)">
            <span class="nav-icon">⚙️</span>Ajustes
        </div>
    </nav>

    <!-- MODALES -->
    <!-- Modal Gasto -->
    <div id="modal-gasto" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal('modal-gasto')">&times;</span>
            <h2 style="margin-bottom: 20px;">Añadir Gasto</h2>
            <div class="input-group">
                <label>Concepto</label>
                <input type="text" id="g-desc">
            </div>
            <div class="input-group">
                <label>Monto (₡)</label>
                <input type="number" id="g-monto">
            </div>
            <div class="input-group">
                <label>Categoría</label>
                <select id="g-cat"></select>
            </div>
            <div class="input-group">
                <label>Fecha</label>
                <input type="date" id="g-fecha">
            </div>
            <button class="btn-submit bg-gasto" onclick="guardarRegistro('gastos')">Guardar Gasto</button>
        </div>
    </div>

    <!-- Modal Ingreso -->
    <div id="modal-ingreso" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal('modal-ingreso')">&times;</span>
            <h2 style="margin-bottom: 20px;">Añadir Ingreso</h2>
            <div class="input-group">
                <label>Detalle / Origen</label>
                <input type="text" id="i-desc" placeholder="Ej. Quincena 1, Paciente...">
            </div>
            <div class="input-group">
                <label>Categoría</label>
                <select id="i-cat">
                    <option>Salario CCSS</option>
                    <option>Asistencia Cirugías</option>
                    <option>Honorarios Profesionales</option>
                    <option>Rendimientos / Intereses</option>
                    <option>Otros</option>
                </select>
            </div>
            <div class="input-group">
                <label>Monto (₡)</label>
                <input type="number" id="i-monto">
            </div>
            <div class="input-group">
                <label>Fecha</label>
                <input type="date" id="i-fecha">
            </div>
            <button class="btn-submit bg-ingreso" onclick="guardarRegistro('ingresos')">Guardar Ingreso</button>
        </div>
    </div>

    <!-- Modal Patrimonio -->
    <div id="modal-patri" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal('modal-patri')">&times;</span>
            <h2 style="margin-bottom: 20px;">Añadir Activo/Inversión</h2>
            <div class="input-group"><label>Instrumento (Ej. CDP, Fondo)</label><input type="text" id="p-desc"></div>
            <div class="input-group"><label>Monto</label><input type="number" id="p-monto"></div>
            <div class="input-group">
                <label>Moneda</label>
                <select id="p-moneda"><option>CRC</option><option>USD</option></select>
            </div>
            <button class="btn-submit bg-patri" onclick="guardarRegistro('patrimonio')">Guardar Patrimonio</button>
        </div>
    </div>

    <script>
        // 1. GESTIÓN DE DATOS (LocalStorage)
        let datos = {
            gastos: JSON.parse(localStorage.getItem('crs_gastos')) || [],
            ingresos: JSON.parse(localStorage.getItem('crs_ingresos')) || [],
            patrimonio: JSON.parse(localStorage.getItem('crs_patrimonio')) || [],
            categorias: JSON.parse(localStorage.getItem('crs_categorias')) || [
                "Alimentación en casa", "Alimentación fuera de casa", "Educación", "Gas de casa", 
                "Gasolina de carro", "Paseos o viajes", "Salud y Medicamentos", "Servicios Públicos", "Transporte", "Otros"
            ],
            aportesPediAhorro: parseInt(localStorage.getItem('crs_aportes')) || 0,
            tipoCambio: parseFloat(localStorage.getItem('crs_bccr')) || null
        };

        const formatoMoneda = (monto) => new Intl.NumberFormat('es-CR', { style: 'currency', currency: 'CRC' }).format(monto);
        
        // 2. INICIALIZACIÓN
        window.onload = () => {
            obtenerTipoCambio();
            if(datos.tipoCambio) {
                document.getElementById('input-bccr').value = datos.tipoCambio;
            }
            document.getElementById('g-fecha').valueAsDate = new Date();
            document.getElementById('i-fecha').valueAsDate = new Date();
            actualizarUI();
        };

        // 3. OBTENER TIPO DE CAMBIO
        async function obtenerTipoCambio() {
            try {
                // Intento 1: API pública de Costa Rica
                const resCR = await fetch('https://tipodecambio.paginasweb.cr/api');
                const dataCR = await resCR.json();
                if(dataCR && dataCR.venta) {
                    datos.tipoCambio = dataCR.venta;
                    document.getElementById('input-bccr').value = datos.tipoCambio;
                    guardarBCCR
